[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "genriesz"
dynamic = ["version"]
description = "Generalized Riesz Regression (GRR) utilities, including nearest-neighbor matching as LSIF/Riesz regression."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GNU General Public License v3.0" }
authors = [
  { name = "Masahiro Kato" }
]
keywords = ["causal inference", "debiased machine learning", "riesz representer", "density ratio", "matching"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
  "numpy>=1.23",
  "scipy>=1.10",
  "scikit-learn>=1.2",
]

[project.optional-dependencies]
data = [
  "pandas>=2.0",
  "pyarrow>=12.0",
]

torch = [
  "torch>=2.0",
]

dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "mypy>=1.8",
]

docs = [
  "sphinx>=7.0",
  "sphinx-rtd-theme>=2.0",
  "myst-parser>=3.0",
  "nbsphinx>=0.9",
  "ipykernel>=6.0",
  "sphinx-autodoc-typehints",
]

[project.urls]
Homepage = "https://genriesz.readthedocs.io/"
Repository = ""
Documentation = "https://genriesz.readthedocs.io/"

[tool.hatch.version]
path = "src/genriesz/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/genriesz"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
addopts = "-q"
